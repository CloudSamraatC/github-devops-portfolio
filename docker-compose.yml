cat << 'EOF' > docker-compose.yml
services:
  web_app:
    build:
      context: ./app
      dockerfile: Dockerfile
    deploy:
      replicas: 3
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  reverse_proxy:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    restart: always
    depends_on:
      web_app:
        condition: service_healthy
EOF
