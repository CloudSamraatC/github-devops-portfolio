services:
  web_app:
    build:
      context: ./app
      dockerfile: Dockerfile
    deploy:
      replicas: 3
    restart: always
    healthcheck:
      # Universal shell execution check utilizing alpine's native nc (netcat) port validation
      test: ["CMD-SHELL", "nc -z localhost 3000 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  reverse_proxy:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    restart: always
    depends_on:
      web_app:
        condition: service_healthy

