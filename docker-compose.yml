services:
  web_app:
    build:
      context: ./app
      dockerfile: Dockerfile
    deploy:
      replicas: 3
    restart: always
    healthcheck:
      # Non-Root Compliance Fix: Uses a native Linux pipe to check port 3000 without requiring permissions
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/3000 && echo -e 'GET /health HTTP/1.1\r\nHost: localhost\r\n\r\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  reverse_proxy:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    restart: always
    depends_on:
      web_app:
        condition: service_healthy

