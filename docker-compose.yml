services:
  web_app:
    build:
      context: ./app
      dockerfile: Dockerfile
    deploy:
      replicas: 3
    restart: always
    healthcheck:
      # Uses Node's built-in network features to check health natively without wget/curl
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (res) => { if (res.statusCode === 200) process.exit(0); else process.exit(1); }).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  reverse_proxy:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    restart: always
    depends_on:
      web_app:
        condition: service_healthy

